name = "countup-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
DISCORD_API_BASE = "https://discord.com/api/v10"
DISCORD_WEB_BASE = "https://discord.com"
GALLERY_ANCHOR_URL = "https://discord.com"

[[d1_databases]]
binding = "DB"
database_name = "countup-db"
database_id = "d6ec1261-0bee-4ee0-8a4f-aff52eb941e8"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

upload_source_maps = true

